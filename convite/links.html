<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Convites — Raphaela & Matheus</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <style>
        body {
            font-family: Georgia, serif;
            background: #fcfbfa;
            color: #374937;
            max-width: 42rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }
        h1 { font-weight: 400; font-size: 2rem; margin-bottom: 0.4rem; }
        h2 { font-weight: 400; font-size: 1.25rem; margin: 2rem 0 0.4rem; }
        p { line-height: 1.6; color: #445b44; }
        label { font-size: 0.95rem; color: #374937; }
        input {
            width: 100%;
            margin: 0.45rem 0 0.8rem;
            padding: 0.75rem 0.8rem;
            border: 1px solid #c5d5c5;
            border-radius: 0.6rem;
            font: inherit;
            font-size: 1.05rem;
            box-sizing: border-box;
        }
        button, .whatsapp {
            border: 1px solid #445b44;
            background: #445b44;
            color: #fff;
            border-radius: 999px;
            padding: 0.7rem 1.1rem;
            font: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button.secondary {
            background: transparent;
            color: #445b44;
        }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            border-top: 1px solid #e3ebe3;
            padding: 1rem 0;
        }
        strong { display: block; font-size: 1.15rem; font-weight: 400; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
        #formStatus { min-height: 1.4rem; }
        .hint { font-size: 0.95rem; }
    </style>
</head>
<body>
    <h1>Convites</h1>
    <p>Escreva o nome de quem vai receber. O convite é criado na hora.</p>
    <form id="newGuest">
        <label for="guestName">Nome</label>
        <input id="guestName" name="nome" type="text" maxlength="80" placeholder="Ex.: Humberto e Eriele" autocomplete="off" required>
        <button type="submit">Criar convite</button>
    </form>
    <p id="formStatus" role="status"></p>
    <h2>Pessoas</h2>
    <ul id="list"></ul>
    <p class="hint">Esta página é só para vocês. Não enviem este endereço para os convidados.</p>
    <script>
        const BASE = 'https://www.raphaelazanin.com.br/convite/';
        const STORAGE_KEY = 'convite-convidados-extra';
        const form = document.getElementById('newGuest');
        const nameInput = document.getElementById('guestName');
        const formStatus = document.getElementById('formStatus');
        const listEl = document.getElementById('list');
        let published = [];
        let created = loadCreated();

        function slugify(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function loadCreated() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(parsed) ? parsed.filter((item) => item && item.nome) : [];
            } catch {
                return [];
            }
        }

        function saveCreated() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(created));
        }

        function inviteUrl(token) {
            return `${BASE}?para=${encodeURIComponent(token)}`;
        }

        function messageFor(nome, url) {
            const plural = /\se\s|&/i.test(nome);
            const convite = plural
                ? `${nome}, temos a alegria de convidar vocês para celebrar o nosso casamento.`
                : `${nome}, temos a alegria de convidar você para celebrar o nosso casamento.`;
            return `${convite} O convite está aqui: ${url}`;
        }

        function allGuests() {
            const seen = new Set();
            return [...created, ...published].filter((guest) => {
                const slug = slugify(guest.slug || guest.nome);
                if (!slug || seen.has(slug)) return false;
                seen.add(slug);
                return true;
            });
        }

        function render() {
            listEl.innerHTML = allGuests().map((guest) => {
                const token = guest.created ? guest.nome : slugify(guest.slug || guest.nome);
                const url = inviteUrl(token);
                const message = messageFor(guest.nome, url);
                const whatsapp = `https://wa.me/?text=${encodeURIComponent(message)}`;
                return `<li>
                    <strong>${escapeHtml(guest.nome)}</strong>
                    <div class="actions">
                        <a class="whatsapp" href="${escapeHtml(whatsapp)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
                        <button type="button" class="secondary" data-message="${escapeHtml(message)}">Copiar mensagem</button>
                    </div>
                </li>`;
            }).join('');
        }

        form.addEventListener('submit', (event) => {
            event.preventDefault();
            const nome = nameInput.value.trim().replace(/\s+/g, ' ').slice(0, 80);
            if (!slugify(nome)) {
                formStatus.textContent = 'Escreva um nome com letras.';
                return;
            }
            const exists = allGuests().some((guest) => slugify(guest.slug || guest.nome) === slugify(nome));
            if (exists) {
                formStatus.textContent = `${nome} já está na lista. É só tocar em Enviar no WhatsApp.`;
                nameInput.value = '';
                return;
            }
            created.unshift({ nome, created: true });
            saveCreated();
            nameInput.value = '';
            render();
            formStatus.textContent = `Convite de ${nome} criado. Toque em Enviar no WhatsApp.`;
        });

        fetch('convidados.json')
            .then((res) => res.json())
            .then((data) => {
                published = Array.isArray(data) ? data : [];
                render();
            });

        listEl.addEventListener('click', async (event) => {
            const btn = event.target.closest('button[data-message]');
            if (!btn) return;
            await navigator.clipboard.writeText(btn.dataset.message);
            const previous = btn.textContent;
            btn.textContent = 'Mensagem copiada';
            setTimeout(() => { btn.textContent = previous; }, 1600);
        });
    </script>
</body>
</html>
