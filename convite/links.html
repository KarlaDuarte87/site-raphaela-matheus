<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Convites — Raphaela & Matheus</title>
    <link rel="icon" type="image/png" href="../assets/favicon.png">
    <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
    <style>
        body {
            font-family: Georgia, serif;
            background: #fcfbfa;
            color: #374937;
            max-width: 42rem;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }
        h1 { font-weight: 400; font-size: 2rem; margin-bottom: 0.4rem; }
        h2 { font-weight: 400; font-size: 1.25rem; margin: 2rem 0 0.4rem; }
        p { line-height: 1.6; color: #445b44; }
        label { font-size: 0.95rem; color: #374937; }
        input {
            width: 100%;
            margin: 0.45rem 0 0.8rem;
            padding: 0.75rem 0.8rem;
            border: 1px solid #c5d5c5;
            border-radius: 0.6rem;
            font: inherit;
            font-size: 1.05rem;
            box-sizing: border-box;
        }
        button, .whatsapp {
            border: 1px solid #445b44;
            background: #445b44;
            color: #fff;
            border-radius: 999px;
            padding: 0.7rem 1.1rem;
            font: inherit;
            font-size: 0.95rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button.secondary {
            background: transparent;
            color: #445b44;
        }
        button.icon {
            background: transparent;
            color: #445b44;
            border-color: transparent;
            padding: 0.45rem;
            line-height: 0;
        }
        button.icon svg { width: 1.15rem; height: 1.15rem; display: block; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            border-top: 1px solid #e3ebe3;
            padding: 1rem 0;
        }
        strong { display: block; font-size: 1.15rem; font-weight: 400; }
        .invite-link { display: block; margin-top: 0.35rem; color: #445b44; word-break: break-all; font-size: 0.9rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.7rem; }
        #formStatus { min-height: 1.4rem; }
        .hint { font-size: 0.95rem; }
        .modal {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            background: rgba(55, 73, 55, 0.35);
        }
        .modal[hidden] { display: none; }
        .modal-card {
            width: 100%;
            max-width: 22rem;
            padding: 1.4rem 1.3rem 1.2rem;
            background: #fcfbfa;
            border-radius: 1rem;
            box-shadow: 0 12px 40px rgba(55, 73, 55, 0.18);
        }
        .modal-card p { margin: 0 0 1.1rem; color: #374937; font-size: 1.15rem; }
    </style>
</head>
<body>
    <h1>Convites</h1>
    <p>Escreva o nome de quem vai receber. O convite é criado na hora.</p>
    <form id="newGuest">
        <label for="guestName">Nome</label>
        <input id="guestName" name="nome" type="text" maxlength="80" placeholder="Ex.: Humberto e Eriele" autocomplete="off" required>
        <button type="submit">Criar convite</button>
    </form>
    <p id="formStatus" role="status"></p>
    <h2>Pessoas</h2>
    <ul id="list"></ul>
    <p class="hint">Os convites novos entram nesta lista em qualquer celular ou computador. Esta página é só para vocês.</p>
    <div id="confirmModal" class="modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
            <p id="confirmTitle"></p>
            <div class="actions">
                <button type="button" class="secondary" id="confirmCancel">Cancelar</button>
                <button type="button" id="confirmOk">Apagar</button>
            </div>
        </div>
    </div>
    <script>
        const BASE = 'https://www.raphaelazanin.com.br/convite/';
        // Endereço /exec do app da Web publicado a partir de convite/planilha-convidados.gs
        const GUESTS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxxzOLNr3Zv9_51XVrOQF3hhbdGDo-bPetbkVn2Kv1ZpL8bBYuw2NgC7UTtUaQ2s1iu/exec';
        const STORAGE_KEY = 'convite-convidados-extra';
        const form = document.getElementById('newGuest');
        const nameInput = document.getElementById('guestName');
        const formStatus = document.getElementById('formStatus');
        const listEl = document.getElementById('list');
        let published = [];
        let created = loadCreated();

        function slugify(value) {
            return String(value || '')
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function loadCreated() {
            try {
                const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
                return Array.isArray(parsed) ? parsed.filter((item) => item && item.nome) : [];
            } catch {
                return [];
            }
        }

        function saveCreated() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(created));
        }

        function loadShared() {
            if (!GUESTS_ENDPOINT) return Promise.resolve(null);
            return new Promise((resolve, reject) => {
                const callback = `conviteGuests_${Date.now()}`;
                const script = document.createElement('script');
                const timer = setTimeout(() => finish(new Error('timeout')), 12000);
                function finish(err, data) {
                    clearTimeout(timer);
                    delete window[callback];
                    script.remove();
                    if (err) reject(err);
                    else resolve(Array.isArray(data) ? data : []);
                }
                window[callback] = (data) => finish(null, data);
                script.onerror = () => finish(new Error('script'));
                script.src = `${GUESTS_ENDPOINT}?callback=${callback}`;
                document.head.appendChild(script);
            });
        }

        function saveShared(nome) {
            if (!GUESTS_ENDPOINT) return Promise.resolve(false);
            return fetch(GUESTS_ENDPOINT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ nome })
            }).then(() => loadShared()).then((list) => {
                if (!list) return false;
                created = list.map((item) => ({ nome: item.nome, created: true }));
                saveCreated();
                return created.some((item) => slugify(item.nome) === slugify(nome));
            });
        }

        function askToDelete(nome) {
            const modal = document.getElementById('confirmModal');
            const title = document.getElementById('confirmTitle');
            const ok = document.getElementById('confirmOk');
            const cancel = document.getElementById('confirmCancel');
            title.textContent = `Apagar o convite de ${nome}?`;
            modal.hidden = false;
            ok.focus();
            return new Promise((resolve) => {
                function close(answer) {
                    modal.hidden = true;
                    ok.removeEventListener('click', onOk);
                    cancel.removeEventListener('click', onCancel);
                    modal.removeEventListener('click', onBackdrop);
                    document.removeEventListener('keydown', onKey);
                    resolve(answer);
                }
                function onOk() { close(true); }
                function onCancel() { close(false); }
                function onBackdrop(event) {
                    if (event.target === modal) close(false);
                }
                function onKey(event) {
                    if (event.key === 'Escape') close(false);
                }
                ok.addEventListener('click', onOk);
                cancel.addEventListener('click', onCancel);
                modal.addEventListener('click', onBackdrop);
                document.addEventListener('keydown', onKey);
            });
        }

        function deleteShared(nome) {
            return fetch(GUESTS_ENDPOINT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ acao: 'apagar', nome })
            }).then(() => loadShared());
        }

        function inviteUrl(token) {
            return `${BASE}?para=${encodeURIComponent(token)}`;
        }

        function messageFor(nome, url) {
            const plural = /\se\s|&/i.test(nome);
            const convite = plural
                ? `${nome}, temos a alegria de convidar vocês para celebrar o nosso casamento.`
                : `${nome}, temos a alegria de convidar você para celebrar o nosso casamento.`;
            return `${convite} O convite está aqui: ${url}`;
        }

        function allGuests() {
            const seen = new Set();
            return [...created, ...published].filter((guest) => {
                const slug = slugify(guest.slug || guest.nome);
                if (!slug || seen.has(slug)) return false;
                seen.add(slug);
                return true;
            });
        }

        function trashIcon() {
            return `<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M8 7l1 13h6l1-13"/></svg>`;
        }

        function render() {
            listEl.innerHTML = allGuests().map((guest) => {
                const token = guest.created ? guest.nome : slugify(guest.slug || guest.nome);
                const url = inviteUrl(token);
                const message = messageFor(guest.nome, url);
                const whatsapp = `https://wa.me/?text=${encodeURIComponent(message)}`;
                const remove = guest.created
                    ? `<button type="button" class="icon" data-delete="${escapeHtml(guest.nome)}" aria-label="Apagar convite de ${escapeHtml(guest.nome)}">${trashIcon()}</button>`
                    : '';
                return `<li>
                    <strong>${escapeHtml(guest.nome)}</strong>
                    <a class="invite-link" href="${escapeHtml(url)}">${escapeHtml(url)}</a>
                    <div class="actions">
                        <a class="whatsapp" href="${escapeHtml(whatsapp)}" target="_blank" rel="noopener">Enviar no WhatsApp</a>
                        <button type="button" class="secondary" data-message="${escapeHtml(message)}">Copiar mensagem</button>
                        ${remove}
                    </div>
                </li>`;
            }).join('');
        }

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const nome = nameInput.value.trim().replace(/\s+/g, ' ').slice(0, 80);
            if (!slugify(nome)) {
                formStatus.textContent = 'Escreva um nome com letras.';
                return;
            }
            const exists = allGuests().some((guest) => slugify(guest.slug || guest.nome) === slugify(nome));
            if (exists) {
                formStatus.textContent = `${nome} já está na lista. É só tocar em Enviar no WhatsApp.`;
                nameInput.value = '';
                return;
            }
            if (!GUESTS_ENDPOINT) {
                created.unshift({ nome, created: true });
                saveCreated();
                nameInput.value = '';
                render();
                formStatus.textContent = 'Convite criado só neste aparelho. A lista compartilhada ainda não está ligada.';
                return;
            }
            formStatus.textContent = 'Salvando na lista...';
            try {
                const saved = await saveShared(nome);
                nameInput.value = '';
                render();
                formStatus.textContent = saved
                    ? `Convite de ${nome} salvo. Ele aparece em qualquer aparelho.`
                    : 'Não consegui confirmar o salvamento. Tente de novo.';
            } catch {
                formStatus.textContent = 'Não consegui salvar na lista compartilhada. Tente de novo.';
            }
        });

        Promise.all([
            fetch('convidados.json').then((res) => res.json()).catch(() => []),
            loadShared().catch(() => null)
        ]).then(([data, shared]) => {
            published = Array.isArray(data) ? data : [];
            if (Array.isArray(shared)) {
                created = shared.map((item) => ({ nome: item.nome, created: true }));
                saveCreated();
            }
            render();
        });

        listEl.addEventListener('click', async (event) => {
            const removeBtn = event.target.closest('button[data-delete]');
            if (removeBtn) {
                const nome = removeBtn.dataset.delete;
                if (!nome || !(await askToDelete(nome))) return;
                if (!GUESTS_ENDPOINT) {
                    created = created.filter((item) => slugify(item.nome) !== slugify(nome));
                    saveCreated();
                    render();
                    formStatus.textContent = `Convite de ${nome} apagado neste aparelho.`;
                    return;
                }
                formStatus.textContent = 'Apagando...';
                try {
                    const list = await deleteShared(nome);
                    if (!Array.isArray(list)) throw new Error('lista');
                    const stillThere = list.some((item) => slugify(item.nome) === slugify(nome));
                    created = list.map((item) => ({ nome: item.nome, created: true }));
                    saveCreated();
                    render();
                    formStatus.textContent = stillThere
                        ? 'Não consegui apagar. Publique a versão nova do script da planilha e tente de novo.'
                        : `Convite de ${nome} apagado.`;
                } catch {
                    formStatus.textContent = 'Não consegui apagar o convite. Tente de novo.';
                }
                return;
            }
            const btn = event.target.closest('button[data-message]');
            if (!btn) return;
            await navigator.clipboard.writeText(btn.dataset.message);
            const previous = btn.textContent;
            btn.textContent = 'Mensagem copiada';
            setTimeout(() => { btn.textContent = previous; }, 1600);
        });
    </script>
</body>
</html>
